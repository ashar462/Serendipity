name: Figma export

on:
  workflow_dispatch:
  push:
    branches: [arena/01a02942-serendipity]
    paths: ['tools/ft.b64', 'scripts/figma_export.py', '.github/workflows/figma-export.yml']

concurrency:
  group: figma-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run export
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          echo "FIGMA_TOKEN=$(base64 -d tools/ft.b64)" >> "$GITHUB_ENV"
          python scripts/figma_export.py
      - name: Commit export
        run: |
          git config user.name "figma-export-bot"
          git config user.email "actions@users.noreply.github.com"
          git add figma-export
          git commit -m "chore: figma export data [skip ci]" || echo "nothing to commit"
          git push
